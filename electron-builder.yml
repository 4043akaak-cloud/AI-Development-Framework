appId: com.adf.taskboard
productName: ADF
electronDist: ./node_modules/electron/dist
# electron-builder 26.15.3 on this environment can materialize the cached
# default_app.asar inconsistently during its Electron ASAR integrity pass.
# Application-level artifact hashes and runtime ledger verification remain enabled.
disableAsarIntegrity: true
directories:
  output: release
mac:
  target:
    - target: dir
      arch:
        - arm64
  category: public.app-category.productivity
files:
  - out/**
  - package.json
